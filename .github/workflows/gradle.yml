name: Build Gradle

on:
  push:
    branches:
      - 'main'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '21'
    - uses: gradle/actions/setup-gradle@v5
    - run: ./gradlew check --continue --stacktrace

  testOldestSupportedMoshi:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '21'
    - uses: gradle/actions/setup-gradle@v5
    - run: ./gradlew check --continue --stacktrace -Pkotshi.internal.useLegacyMoshi=true

  deploySnapshot:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [test, testOldestSupportedMoshi]
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '21'
    - uses: gradle/actions/setup-gradle@v5
    - run: ./gradlew publishSnapshot --stacktrace
      env:
        SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
        SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
